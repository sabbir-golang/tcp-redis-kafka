<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CSV Processing Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  padding: 20px;
  text-align: center;
}

h1 {
  margin-bottom: 20px;
}

.upload-box {
  margin-bottom: 20px;
}

input {
  padding: 10px;
  background: #1e293b;
  color: white;
  border: none;
}

button {
  padding: 10px 15px;
  background: #38bdf8;
  border: none;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #0ea5e9;
}

.cards {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
  width: 180px;
  box-shadow: 0 0 10px #000;
}

.card h2 {
  color: #38bdf8;
  margin: 0;
  font-size: 28px;
}

.logs {
  margin-top: 30px;
  background: #111827;
  padding: 15px;
  height: 300px;
  overflow-y: auto;
  text-align: left;
  border-radius: 10px;
}

.log {
  font-size: 13px;
  padding: 2px 0;
  color: #a5f3fc;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 CSV Processing Dashboard</h1>

<div class="upload-box">
  <input type="file" id="fileInput" />
  <button onclick="uploadCSV()">Upload CSV</button>
</div>

<div class="cards">

  <div class="card">
    <h2 id="total">0</h2>
    <p>Total Rows</p>
  </div>

  <div class="card">
    <h2 id="inserted">0</h2>
    <p>Inserted</p>
  </div>

  <div class="card">
    <h2 id="failed">0</h2>
    <p>Failed / Duplicate</p>
  </div>

  <div class="card">
    <h2 id="time">0s</h2>
    <p>Processing Time</p>
  </div>

</div>

<div class="logs" id="logBox">
  <div class="log">System ready...</div>
</div>

</div>

<script>

function addLog(msg) {
  const box = document.getElementById("logBox");
  const div = document.createElement("div");
  div.className = "log";
  div.innerText = msg;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function uploadCSV() {

  const fileInput = document.getElementById("fileInput");
  const file = fileInput.files[0];

  if (!file) {
    alert("Please select a CSV file!");
    return;
  }

  addLog("📤 Upload started...");

  const formData = new FormData();
  formData.append("file", file);

  const start = performance.now();

  try {
    const res = await fetch("http://localhost:8080/upload", {
      method: "POST",
      body: formData
    });

    const data = await res.json();

    const end = performance.now();
    const timeSec = ((end - start) / 1000).toFixed(2);

    document.getElementById("total").innerText = data.total;
    document.getElementById("inserted").innerText = data.inserted;
    document.getElementById("failed").innerText = data.failed;
    document.getElementById("time").innerText = timeSec + "s";

    addLog("✅ Upload completed");
    addLog("📊 Total: " + data.total);
    addLog("💾 Inserted: " + data.inserted);
    addLog("❌ Failed: " + data.failed);
    addLog("⏱ Time: " + timeSec + "s");

  } catch (err) {
    addLog("❌ Error: " + err.message);
  }
}

</script>

</body>
</html>
